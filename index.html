<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本マッチメーカー 会員管理システム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#c94f7c;--pink-light:#fbeaf0;--pink-mid:#ed93b1;
  --bg:#f8f5f7;--bg2:#fff;--bg3:#f3f0f2;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:#e0d8dc;--border2:#ccc;
  --radius:10px;--radius-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:14px;color:var(--text);background:var(--bg);min-height:100vh}

/* ログイン */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.login-logo{text-align:center;margin-bottom:1.8rem}
.login-logo .brand{font-size:20px;font-weight:600;color:var(--pink)}
.login-logo .sub{font-size:12px;color:var(--text2);margin-top:6px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;display:block}
.form-input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;margin-bottom:12px}
.form-input:focus{outline:none;border-color:var(--pink)}
.btn-primary{width:100%;padding:11px;background:var(--pink);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary:hover{opacity:.9}
.login-err{color:#e24b4a;font-size:12px;margin-bottom:8px;min-height:16px}
.login-reset{background:none;border:none;font-size:11px;color:#aaa;cursor:pointer;text-decoration:underline;margin-top:10px;width:100%}

/* ヘッダー */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-brand{font-size:15px;font-weight:700;color:var(--pink)}
.header-right{display:flex;align-items:center;gap:8px}
.header-user{font-size:13px;color:var(--text2)}
.role-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--pink-light);color:var(--pink)}
.role-badge.viewer{background:#e8f4e8;color:#3b6d11}
.btn-sm{padding:6px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;background:var(--bg2);font-family:inherit}
.btn-sm:hover{background:var(--bg3)}
.btn-add{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn-add:hover{opacity:.9}

/* コンテンツ */
.content{padding:16px;max-width:1200px;margin:0 auto}
.viewer-banner{background:#f0f7f0;border:1px solid #c3dfc3;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:13px;color:#3b6d11}

/* タブ */
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid var(--border)}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--pink);border-bottom-color:var(--pink);font-weight:600}

/* 検索 */
.search-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.search-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.search-row:last-child{margin-bottom:0}
.s-input{padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;flex:1;min-width:140px}
.s-select{padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;flex:1;min-width:140px}
.search-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.btn-search{padding:7px 20px;background:var(--pink);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-family:inherit}
.btn-clear{padding:7px 14px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-family:inherit}

/* 会員グリッド */
.count-label{font-size:12px;color:var(--text2);margin-bottom:10px}
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.member-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.member-card:hover{border-color:var(--pink-mid);box-shadow:0 2px 8px rgba(201,79,124,.1)}
.member-card.caution-card{border-color:#f7c1c1;background:#fff8f8}
.mc-avatar{width:150px;height:150px;border-radius:var(--radius);background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;margin:0 auto 10px}
.mc-avatar img{width:150px;height:150px;border-radius:var(--radius);object-fit:cover}
.mc-name{font-size:15px;font-weight:600;text-align:center}
.mc-meta{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.6;text-align:center}
.mc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;justify-content:center}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--pink-light);color:var(--pink)}
.mc-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.btn-edit{flex:1;padding:6px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;background:var(--bg2);font-family:inherit}
.btn-edit:hover{background:var(--bg3)}
.btn-del{padding:6px 10px;border:1px solid #f7c1c1;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;background:#fff;color:#e24b4a;font-family:inherit}
.btn-del:hover{background:#fcebeb}
.empty-state{text-align:center;padding:3rem;color:var(--text2)}

/* モーダル */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius);width:100%;max-width:620px;margin:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600}
.btn-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);line-height:1;padding:0}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* フォーム */
.form-section-title{font-size:12px;font-weight:600;color:var(--pink);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--pink-light)}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.form-group{margin-bottom:10px}
.form-group label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:3px;display:block}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit}
.form-group textarea{height:80px;resize:vertical}
.checkbox-row{display:flex;align-items:center;gap:6px;font-size:13px}

/* 写真アップロード */
.photo-upload{position:relative;width:100px;height:100px;border:2px dashed var(--border2);border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px}
.photo-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-upload img{width:100%;height:100%;object-fit:cover}

/* 家族テーブル */
.family-table{width:100%;border-collapse:collapse;font-size:12px}
.family-table th{background:var(--bg3);padding:5px 8px;text-align:left;font-weight:600;border:1px solid var(--border)}
.family-table td{padding:4px;border:1px solid var(--border)}
.family-table input{width:100%;border:none;padding:3px 5px;font-size:12px;font-family:inherit}
.btn-row-add{font-size:11px;padding:3px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);cursor:pointer;background:var(--bg2);margin-top:5px;font-family:inherit}
.btn-row-del{font-size:11px;padding:2px 6px;border:1px solid #f7c1c1;border-radius:var(--radius-sm);cursor:pointer;background:#fff;color:#e24b4a;font-family:inherit}

/* 詳細 */
.detail-photo{width:200px;height:200px;border-radius:var(--radius);object-fit:cover;border:1px solid var(--border)}
.detail-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.detail-section{margin-bottom:14px}
.detail-section-title{font-size:12px;font-weight:600;color:var(--pink);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--pink-light)}
.detail-table{width:100%;border-collapse:collapse;font-size:13px}
.detail-table td{padding:5px 8px;border-bottom:1px solid var(--border)}
.detail-table td:first-child{width:100px;color:var(--text2);font-weight:500}

/* 設定 */
.settings-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.settings-section h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text)}
.conn-status{font-size:12px;margin-top:6px;padding:5px 10px;border-radius:var(--radius-sm);display:inline-block}
.conn-ok{background:#e8f4e8;color:#3b6d11}
.conn-err{background:#fce8e8;color:#c0392b}
.account-row{display:flex;align-items:center;justify-content:space-between;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px}
.account-info{display:flex;align-items:center;gap:8px;font-size:13px}
.account-role{font-size:11px;padding:2px 8px;border-radius:20px}
.account-role.admin{background:var(--pink-light);color:var(--pink)}
.account-role.viewer{background:#e8f4e8;color:#3b6d11}
.btn-edit-sm{padding:3px 8px;font-size:11px;border:1px solid var(--border2);border-radius:var(--radius-sm);cursor:pointer;background:#fff;color:var(--text);font-family:inherit}
.btn-del-sm{padding:3px 8px;font-size:11px;border:1px solid #f7c1c1;border-radius:var(--radius-sm);cursor:pointer;background:#fff;color:#e24b4a;font-family:inherit}
.office-row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:5px;font-size:13px}
.input-row{display:flex;gap:6px;margin-top:8px}
.input-row input{flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit}

/* お見合い */
.omiai-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.omiai-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.omiai-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.omiai-badge.pending{background:#fff3cd;color:#856404}
.omiai-badge.accepted{background:#e8f4e8;color:#3b6d11}
.omiai-badge.rejected{background:#fce8e8;color:#c0392b}
.omiai-names{font-size:14px;font-weight:600;margin-bottom:4px}
.omiai-meta{font-size:12px;color:var(--text2)}
.omiai-actions{display:flex;gap:6px;margin-top:10px}
.btn-accept{padding:5px 14px;background:#e8f4e8;color:#3b6d11;border:1px solid #c3dfc3;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-family:inherit}
.btn-reject{padding:5px 14px;background:#fce8e8;color:#c0392b;border:1px solid #f5c6c6;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-family:inherit}

/* 印刷 */
#print-area{display:none}
@media print{
  body>*{display:none}
  #print-area{display:block!important;position:fixed;top:0;left:0;width:100%;padding:20px;background:#fff}
  #print-area *{visibility:visible}
}
.print-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--pink);padding-bottom:10px;margin-bottom:16px}
.print-brand{font-size:16px;font-weight:700;color:var(--pink)}
.print-top{display:flex;gap:16px;margin-bottom:16px}
.print-photo{width:100px;height:100px;object-fit:cover;border-radius:6px}
.print-name{font-size:18px;font-weight:700}
.print-section{margin-bottom:12px}
.print-section-title{font-size:12px;font-weight:600;color:var(--pink);border-bottom:1px solid var(--pink-light);padding-bottom:3px;margin-bottom:6px}
.print-table{width:100%;border-collapse:collapse;font-size:12px}
.print-table td{padding:4px 8px;border-bottom:1px solid #eee}
.print-table td:first-child{width:90px;color:#666}
.print-footer{font-size:11px;color:#999;margin-top:16px;text-align:right}
</style>
</head>
<body>

<div id="print-area"></div>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand">💍 日本マッチメーカー</div>
      <div class="sub">仲人専用 会員管理システム</div>
    </div>
    <label class="form-label">ユーザーID</label>
    <input type="text" class="form-input" id="login-id" placeholder="例：admin" autocomplete="username">
    <label class="form-label">パスワード</label>
    <input type="password" class="form-input" id="login-pw" placeholder="パスワードを入力" autocomplete="current-password">
    <div class="login-err" id="login-err"></div>
    <button class="btn-primary" id="btn-login" onclick="doLogin()">ログイン</button>
    <button class="login-reset" onclick="resetAndLogin()">アカウント情報をリセット（ログインできない場合）</button>
  </div>
</div>

<!-- メイン画面 -->
<div id="main-screen" style="display:none">
  <div class="header">
    <div class="header-brand">💍 日本マッチメーカー</div>
    <div class="header-right">
      <span class="header-user" id="current-user"></span>
      <span class="role-badge" id="role-badge"></span>
      <button class="btn-sm" id="btn-settings" style="display:none" onclick="showSettings()">⚙ 設定</button>
      <button class="btn-sm btn-add" id="btn-add" style="display:none" onclick="openAddModal()">＋ 会員追加</button>
      <button class="btn-sm" onclick="doLogout()">ログアウト</button>
    </div>
  </div>
  <div class="content">
    <div id="viewer-banner" class="viewer-banner" style="display:none">👁 閲覧専用モードでログイン中です。</div>
    <div class="tabs">
      <div class="tab active" id="tab-male" onclick="switchTab('male')">男性会員</div>
      <div class="tab" id="tab-female" onclick="switchTab('female')">女性会員</div>
      <div class="tab" id="tab-all" onclick="switchTab('all')">全会員</div>
      <div class="tab" id="tab-omiai" onclick="switchTab('omiai')">お見合い管理</div>
    </div>
    <div id="member-section">
      <div class="search-box">
        <div class="search-row">
          <input type="text" class="s-input" id="s-name" placeholder="名前で検索">
          <select class="s-select" id="s-age"><option value="">年齢（全て）</option><option value="30">〜30代</option><option value="40">40代</option><option value="50">50代</option><option value="60">60代〜</option></select>
          <select class="s-select" id="s-income"><option value="">年収（全て）</option><option value="200">〜200万</option><option value="400">〜400万</option><option value="600">〜600万</option><option value="600+">600万〜</option></select>
          <select class="s-select" id="s-married"><option value="">婚歴（全て）</option><option value="未婚">未婚</option><option value="生別">生別（離婚）</option><option value="死別">死別</option></select>
        </div>
        <div class="search-row">
          <input type="text" class="s-input" id="s-area" placeholder="エリア（例：札幌市）">
          <select class="s-select" id="s-gender"><option value="">性別（全て）</option><option value="男性">男性</option><option value="女性">女性</option></select>
          <select class="s-select" id="s-office"><option value="">所属相談所（全て）</option></select>
        </div>
        <div class="search-btns">
          <button class="btn-clear" onclick="clearSearch()">クリア</button>
          <button class="btn-search" onclick="doSearch()">● 検索</button>
        </div>
      </div>
      <div class="count-label" id="count-label"></div>
      <div class="members-grid" id="members-grid"></div>
    </div>
    <div id="omiai-section" style="display:none">
      <div class="count-label" id="omiai-count-label"></div>
      <div id="omiai-list"></div>
    </div>
  </div>
</div>

<!-- 設定画面 -->
<div id="settings-screen" style="display:none">
  <div class="header">
    <div class="header-brand">⚙ 設定</div>
    <button class="btn-sm" onclick="backToMain()">← 戻る</button>
  </div>
  <div class="content">
    <div class="settings-section">
      <h3>Supabase接続設定</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:10px">URLとAPIキーを設定するとクラウドにデータが保存されます。</p>
      <div class="form-group"><label>Supabase URL</label><input type="text" id="sb-url" placeholder="https://xxxx.supabase.co"></div>
      <div class="form-group"><label>anon key</label><input type="password" id="sb-key" placeholder="eyJ..."></div>
      <button class="btn-sm" onclick="testConnection()">接続テスト</button>
      <span class="conn-status" id="conn-status" style="display:none"></span>
      <button class="btn-sm" style="margin-left:8px" onclick="saveSbConfigAndReload()">保存する</button>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
        <p style="font-size:12px;color:var(--text2);margin-bottom:8px">📸 写真一括移行：このPC上の写真をクラウドに送ります（初回1回だけ実行）</p>
        <button class="btn-sm" onclick="migrateAllPhotos()" id="btn-migrate">写真を一括移行する</button>
        <span id="migrate-status" style="font-size:12px;margin-left:8px;color:var(--text2)"></span>
      </div>
    </div>
    <div class="settings-section">
      <h3>アカウント管理</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:10px">管理者は全機能が使えます。閲覧者は会員情報の閲覧のみできます。</p>
      <div id="account-list"></div>
      <button class="btn-sm btn-add" style="margin-top:8px" onclick="document.getElementById('account-modal').classList.add('open')">＋ アカウント追加</button>
    </div>
    <div class="settings-section">
      <h3>所属相談所の管理</h3>
      <div id="office-list"></div>
      <div class="input-row">
        <input type="text" id="new-office-input" placeholder="相談所名を入力">
        <button class="btn-sm" onclick="addOffice()">追加</button>
      </div>
    </div>
  </div>
</div>

<!-- 会員追加・編集モーダル -->
<div class="modal-bg" id="member-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">会員を追加</div>
      <button class="btn-close" onclick="closeModal('member-modal')">×</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:16px;align-items:flex-start">
        <div>
          <div class="photo-upload" id="photo-upload-area">
            <input type="file" accept="image/*" onchange="handlePhoto(this)">
            <div id="photo-icon" style="text-align:center;color:var(--text3)"><div style="font-size:24px">📷</div><div style="font-size:10px;margin-top:4px">写真追加</div></div>
            <img id="photo-preview" style="display:none;width:100%;height:100%;object-fit:cover">
          </div>
          <button onclick="clearPhoto()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;width:100%;text-align:center">写真を削除</button>
        </div>
        <div style="flex:1">
          <div class="form-row">
            <div class="form-group"><label>氏名（イニシャル可）</label><input type="text" id="f-name" placeholder="例：山田 太郎"></div>
            <div class="form-group"><label>性別</label><select id="f-gender"><option>男性</option><option>女性</option></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>生年月日</label><input type="text" id="f-birth" placeholder="例：昭和40年3月"></div>
            <div class="form-group"><label>身長・体重</label><input type="text" id="f-height" placeholder="例：170cm/65kg"></div>
          </div>
        </div>
      </div>
      <div class="form-section-title">基本情報</div>
      <div class="form-row">
        <div class="form-group"><label>現住所</label><input type="text" id="f-area" placeholder="例：札幌市"></div>
        <div class="form-group"><label>最終学歴</label><input type="text" id="f-edu" placeholder="例：大卒"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>職業</label><input type="text" id="f-job" placeholder="例：会社員"></div>

<script>
// ========== 定数 ==========
const STORAGE_KEY='nmm_members_v1';
const ACCOUNTS_KEY='nmm_accounts_v3';
const SB_CFG_KEY='nmm_sb_config';
const OFFICES_KEY='nmm_offices';

// ========== Supabase固定設定 ==========
const SB_URL_DEFAULT='https://tnrtzutzqxfesnjiexym.supabase.co';
const SB_KEY_DEFAULT='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRucnR6dXR6cXhmZXNuamlleHltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDQ4ODcsImV4cCI6MjA5NDYyMDg4N30.IYXdn-RQAnVzccEAR40wZTWwArD8w-4XRdsytfjAsVE';

// ========== 状態 ==========
let state={
  members:[],
  currentTab:'male',
  editingId:null,
  detailId:null,
  currentUser:null,
  currentRole:null,
  photoData:null,
  photoFile:null,
  sbUrl:SB_URL_DEFAULT,
  sbKey:SB_KEY_DEFAULT
};

// ========== ユーティリティ ==========
function isAdmin(){return state.currentRole==='admin';}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function calcAge(birth){
  if(!birth)return null;
  const m=birth.match(/(\d+)/);
  if(!m)return null;
  let y=parseInt(m[1]);
  if(birth.includes('昭和'))y+=1925;
  else if(birth.includes('平成'))y+=1988;
  else if(birth.includes('令和'))y+=2018;
  else if(y<50)y+=2000;
  else if(y<100)y+=1900;
  const age=new Date().getFullYear()-y;
  return(age>0&&age<120)?age:null;
}

// ========== Supabase ==========
function loadSbConfig(){
  try{const d=localStorage.getItem(SB_CFG_KEY);if(d){const c=JSON.parse(d);state.sbUrl=c.url||SB_URL_DEFAULT;state.sbKey=c.key||SB_KEY_DEFAULT;}else{state.sbUrl=SB_URL_DEFAULT;state.sbKey=SB_KEY_DEFAULT;}}catch(e){state.sbUrl=SB_URL_DEFAULT;state.sbKey=SB_KEY_DEFAULT;}
}
function sbH(){return{'Content-Type':'application/json','apikey':state.sbKey,'Authorization':'Bearer '+state.sbKey,'Prefer':'return=representation'};}
async function sbFetch(path,opts={}){return fetch(state.sbUrl+'/rest/v1/'+path,{...opts,headers:{...sbH(),...(opts.headers||{})}});}
async function loadFromSupabase(){
  if(!state.sbUrl||!state.sbKey)return false;
  try{
    const res=await sbFetch('members?select=*&order=updated_at.desc');
    if(res.ok){state.members=mergePhotos(await res.json());return true;}
  }catch(e){}
  return false;
}
async function upsertToSupabase(m){
  if(!state.sbUrl||!state.sbKey)return false;
  try{
    // まず写真なしで保存
    const mNoPhoto={...m};delete mNoPhoto.photo;
    const res=await sbFetch('members',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(mNoPhoto)});
    if(!res.ok)return false;
    // 写真があれば別途更新
    if(m.photo){
      await sbFetch('members?id=eq.'+encodeURIComponent(m.id),{method:'PATCH',body:JSON.stringify({photo:m.photo})});
    }
    return true;
  }catch(e){return false;}
}
async function deleteFromSupabase(id){
  if(!state.sbUrl||!state.sbKey)return false;
  try{const res=await sbFetch('members?id=eq.'+encodeURIComponent(id),{method:'DELETE'});return res.ok;}catch(e){return false;}
}
function loadLocal(){try{const d=localStorage.getItem(STORAGE_KEY);if(d)state.members=JSON.parse(d);}catch(e){}}
function saveLocal(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.members));}catch(e){}}

// ========== 写真（Supabase Storage）==========
function savePhotoLocal(id,photo){try{if(photo){localStorage.setItem('nmm_photo_'+id,photo);}else{localStorage.removeItem('nmm_photo_'+id);}}catch(e){}}
function loadPhotoLocal(id){try{return localStorage.getItem('nmm_photo_'+id)||null;}catch(e){return null;}}
function mergePhotos(members){return members.map(m=>({...m,photo:m.photo||loadPhotoLocal(m.id)||null}));}
async function uploadPhotoToStorage(id,file){return null;}

// ========== アカウント ==========
function resetAndLogin(){
  if(!confirm('アカウント情報をリセットします。\nadmin/nakodo2024でログインできるようになります。'))return;
  ['nmm_accounts_v1','nmm_accounts_v2','nmm_accounts_v3'].forEach(k=>localStorage.removeItem(k));
  document.getElementById('login-err').textContent='リセット完了。admin/nakodo2024でログインしてください';
}
function loadAccounts(){
  try{const d=localStorage.getItem(ACCOUNTS_KEY);if(d)return JSON.parse(d);}catch(e){}
  return [{id:'admin',pw:'nakodo2024',role:'admin'}];
}
function saveAccounts(a){try{localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(a));}catch(e){}}

// ========== ログイン ==========
function doLogin(){
  const id=document.getElementById('login-id').value.trim();
  const pw=document.getElementById('login-pw').value;
  if(!id||!pw){document.getElementById('login-err').textContent='IDとパスワードを入力してください';return;}
  const accounts=loadAccounts();
  const account=accounts.find(a=>a.id===id&&a.pw===pw);
  if(!account){document.getElementById('login-err').textContent='IDまたはパスワードが違います';return;}
  // adminは強制admin、それ以外はroleに従う
  state.currentUser=id;
  state.currentRole=id==='admin'?'admin':(account.role||'viewer');
  loadSbConfig();
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
  document.getElementById('current-user').textContent=id+'さん';
  const badge=document.getElementById('role-badge');
  if(isAdmin()){
    badge.textContent='管理者';badge.className='role-badge';
    document.getElementById('btn-settings').style.display='';
    document.getElementById('btn-add').style.display='';
  }else{
    badge.textContent='閲覧者';badge.className='role-badge viewer';
    document.getElementById('viewer-banner').style.display='block';
  }
  loadData();
}
document.getElementById('login-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function doLogout(){
  state.currentUser=null;state.currentRole=null;
  document.getElementById('main-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-id').value='';
  document.getElementById('login-pw').value='';
  document.getElementById('login-err').textContent='';
}

async function loadData(){
  const ok=await loadFromSupabase();
  if(!ok)loadLocal();
  renderMembers();
  updateOfficeOptions();
  checkNotifications();
}

// ========== タブ ==========
function switchTab(t){
  state.currentTab=t;
  ['male','female','all','omiai'].forEach(x=>{
    document.getElementById('tab-'+x).classList.toggle('active',x===t);
  });
  const isOmiai=t==='omiai';
  document.getElementById('member-section').style.display=isOmiai?'none':'block';
  document.getElementById('omiai-section').style.display=isOmiai?'block':'none';
  if(isOmiai)renderOmiai();
  else renderMembers();
}

// ========== 検索 ==========
function doSearch(){renderMembers({
  name:document.getElementById('s-name').value.toLowerCase(),
  age:document.getElementById('s-age').value,
  income:document.getElementById('s-income').value,
  married:document.getElementById('s-married').value,
  area:document.getElementById('s-area').value.toLowerCase(),
  gender:document.getElementById('s-gender').value,
  office:document.getElementById('s-office').value
});}
function clearSearch(){
  ['s-name','s-area'].forEach(id=>document.getElementById(id).value='');
  ['s-age','s-income','s-married','s-gender','s-office'].forEach(id=>document.getElementById(id).value='');
  renderMembers();
}
function updateOfficeOptions(){
  const sel=document.getElementById('s-office');
  const cur=sel.value;
  const offices=[...new Set(state.members.map(m=>m.office).filter(Boolean))].sort();
  sel.innerHTML='<option value="">所属相談所（全て）</option>'+offices.map(o=>`<option value="${o}">${o}</option>`).join('');
  sel.value=cur;
}

// ========== 会員一覧 ==========
function renderMembers(f={}){
  let list=[...state.members];
  const tab=state.currentTab;
  if(tab==='male')list=list.filter(m=>m.gender==='男性');
  else if(tab==='female')list=list.filter(m=>m.gender==='女性');
  if(f.name)list=list.filter(m=>(m.name||'').toLowerCase().includes(f.name));
  if(f.area)list=list.filter(m=>(m.area||'').toLowerCase().includes(f.area));
  if(f.married)list=list.filter(m=>m.married===f.married);
  if(f.gender)list=list.filter(m=>m.gender===f.gender);
  if(f.office)list=list.filter(m=>m.office===f.office);
  if(f.age){
    list=list.filter(m=>{
      const age=calcAge(m.birth);if(!age)return false;
      if(f.age==='30')return age<=39;
      if(f.age==='40')return age>=40&&age<=49;
      if(f.age==='50')return age>=50&&age<=59;
      if(f.age==='60')return age>=60;
      return true;
    });
  }
  if(f.income){
    list=list.filter(m=>{
      const inc=parseInt(m.income)||0;
      if(f.income==='200')return inc<=200;
      if(f.income==='400')return inc>200&&inc<=400;
      if(f.income==='600')return inc>400&&inc<=600;
      if(f.income==='600+')return inc>600;
      return true;
    });
  }
  document.getElementById('count-label').textContent=list.length+'件';
  if(list.length===0){
    document.getElementById('members-grid').innerHTML='<div class="empty-state"><div class="icon">🔍</div><div>該当する会員がいません</div></div>';
    return;
  }
  document.getElementById('members-grid').innerHTML=list.map(m=>{
    const age=calcAge(m.birth);
    const av=m.photo?`<div class="mc-avatar"><img src="${m.photo}" alt="${m.name}"></div>`:`<div class="mc-avatar">👤</div>`;
    const tags=[m.married,m.hobby?m.hobby.split(/[、,]/)[0]:null].filter(Boolean).map(t=>`<span class="tag">${t}</span>`).join('');
    const actions=isAdmin()?`<div class="mc-actions"><button class="btn-edit" onclick="event.stopPropagation();openEditModal('${m.id}')">✏ 編集</button><button class="btn-del" onclick="event.stopPropagation();confirmDelete('${m.id}')">🗑</button></div>`:'';
    return`<div class="member-card${m.caution?' caution-card':''}" onclick="showDetail('${m.id}')">${av}<div class="mc-name">${m.caution?'📋 ':''} ${m.name||'（名前未設定）'}</div><div class="mc-meta">${[m.gender,age?age+'歳':'',m.area].filter(Boolean).join('　')}</div><div class="mc-meta">${[m.job,m.income?m.income+'万円':''].filter(Boolean).join('　')}</div><div class="mc-tags">${tags}</div>${actions}</div>`;
  }).join('');
  updateOfficeOptions();
}

// ========== 詳細 ==========
function showDetail(id){
  const m=state.members.find(x=>x.id===id);
  if(!m)return;
  state.detailId=id;
  const age=calcAge(m.birth);
  const rows=[['生年月日',m.birth],['年齢',age?age+'歳':''],['性別',m.gender],['身長・体重',m.height],['現住所',m.area],['最終学歴',m.edu],['年収',m.income?m.income+'万円':''],['職業',m.job],['職種',m.job2],['所属相談所',m.office],['趣味',m.hobby],['婚歴',m.married]].filter(r=>r[1]);
  const ph=m.photo?`<img src="${m.photo}" class="detail-photo">`:`<div class="detail-photo" style="background:#f3f0f2;display:flex;align-items:center;justify-content:center;font-size:28px">👤</div>`;
  const fam=m.family&&m.family.length?`<div class="detail-section"><div class="detail-section-title">家族構成</div><table class="detail-table">${m.family.map(f=>`<tr><td>${f.rel}</td><td>${f.status}</td></tr>`).join('')}</table></div>`:'';
  document.getElementById('detail-body').innerHTML=`<div class="detail-top">${ph}<div><div style="font-size:18px;font-weight:600">${m.caution?'📋 ':''}${m.name||'（名前未設定）'}</div><div style="font-size:13px;color:var(--text2);margin-top:4px">${[m.gender,age?age+'歳':'',m.area].filter(Boolean).join('　')}</div></div></div><div class="detail-section"><div class="detail-section-title">基本情報</div><table class="detail-table">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>${m.note?`<div class="detail-section"><div class="detail-section-title">コメント</div><div style="font-size:13px;line-height:1.8;white-space:pre-wrap">${m.note}</div></div>`:''}${fam}`;
  const editBtn=document.getElementById('detail-edit-btn');
  editBtn.style.display=isAdmin()?'':'none';
  document.getElementById('detail-modal').classList.add('open');
}
function editFromDetail(){
  closeModal('detail-modal');
  openEditModal(state.detailId);
}

// ========== 会員追加・編集 ==========
function openAddModal(){
  if(!isAdmin()){alert('管理者権限が必要です');return;}
  state.editingId=null;state.photoData=null;state.photoFile=null;
  document.getElementById('modal-title').textContent='会員を追加';
  clearForm();updateOfficeDropdown();
  document.getElementById('member-modal').classList.add('open');
}
function openEditModal(id){
  if(!isAdmin()){alert('管理者権限が必要です');return;}
  const m=state.members.find(x=>x.id===id);
  if(!m){alert('会員データが見つかりません');return;}
  state.editingId=id;state.photoData=m.photo||null;state.photoFile=null;
  document.getElementById('modal-title').textContent='会員情報を編集';
  updateOfficeDropdown();fillForm(m);
  document.getElementById('member-modal').classList.add('open');
}
function clearForm(){
  ['f-name','f-birth','f-height','f-area','f-edu','f-job','f-job2','f-hobby','f-note'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('f-income').value='';
  document.getElementById('f-gender').value='男性';
  document.getElementById('f-married').value='未婚';
  document.getElementById('f-office').value='';
  document.getElementById('f-caution').checked=false;
  document.getElementById('photo-preview').style.display='none';
  document.getElementById('photo-icon').style.display='block';
  document.getElementById('family-tbody').innerHTML='';
  addFamilyRow();
}
function fillForm(m){
  ['name','birth','height','area','edu','job','job2','hobby','note'].forEach(k=>{const el=document.getElementById('f-'+k);if(el)el.value=m[k]||'';});
  document.getElementById('f-income').value=m.income||'';
  document.getElementById('f-gender').value=m.gender||'男性';
  document.getElementById('f-married').value=m.married||'未婚';
  document.getElementById('f-office').value=m.office||'';
  document.getElementById('f-caution').checked=m.caution||false;
  if(m.photo){document.getElementById('photo-preview').src=m.photo;document.getElementById('photo-preview').style.display='block';document.getElementById('photo-icon').style.display='none';}
  else{document.getElementById('photo-preview').style.display='none';document.getElementById('photo-icon').style.display='block';}
  document.getElementById('family-tbody').innerHTML='';
  (m.family&&m.family.length?m.family:[{rel:'',status:''}]).forEach(f=>addFamilyRow(f.rel,f.status));
}
async function saveMember(){
  if(!isAdmin())return;
  const family=Array.from(document.getElementById('family-tbody').querySelectorAll('tr')).map(tr=>{const ins=tr.querySelectorAll('input');return{rel:ins[0].value.trim(),status:ins[1].value.trim()};}).filter(f=>f.rel||f.status);
  const member={
    id:state.editingId||(Date.now().toString(36)+Math.random().toString(36).slice(2)),
    name:document.getElementById('f-name').value.trim(),
    gender:document.getElementById('f-gender').value,
    birth:document.getElementById('f-birth').value,
    height:document.getElementById('f-height').value,
    area:document.getElementById('f-area').value,
    edu:document.getElementById('f-edu').value,
    income:document.getElementById('f-income').value,
    job:document.getElementById('f-job').value,
    job2:document.getElementById('f-job2').value,
    office:document.getElementById('f-office').value,
    hobby:document.getElementById('f-hobby').value,
    married:document.getElementById('f-married').value,
    caution:document.getElementById('f-caution').checked,
    note:document.getElementById('f-note').value,
    family,photo:state.photoData||null,
    updated_at:new Date().toISOString()
  };
  if(state.editingId){const idx=state.members.findIndex(m=>m.id===state.editingId);if(idx>=0)state.members[idx]=member;}
  else{state.members.unshift(member);}
  const ok=await upsertToSupabase(member);
  if(!ok)saveLocal();
  closeModal('member-modal');renderMembers();
}
function confirmDelete(id){
  if(!isAdmin())return;
  if(!confirm('この会員データを削除しますか？'))return;
  deleteMember(id);
}
async function deleteMember(id){
  state.members=state.members.filter(m=>m.id!==id);
  savePhotoLocal(id,null);
  const ok=await deleteFromSupabase(id);
  if(!ok)saveLocal();
  renderMembers();
}

// ========== 写真（自動圧縮・DB直接保存）==========
function handlePhoto(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const maxW=300;
      let w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const compressed=canvas.toDataURL('image/jpeg',0.4);
      state.photoData=compressed;
      state.photoFile=null;
      document.getElementById('photo-preview').src=compressed;
      document.getElementById('photo-preview').style.display='block';
      document.getElementById('photo-icon').style.display='none';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearPhoto(){
  state.photoData=null;state.photoFile=null;
  document.getElementById('photo-preview').style.display='none';
  document.getElementById('photo-icon').style.display='block';
}

// ========== 印刷 ==========
function printMember(){
  const m=state.members.find(x=>x.id===state.detailId);if(!m)return;
  const age=calcAge(m.birth);
  const rows=[['生年月日',m.birth],['年齢',age?age+'歳':''],['性別',m.gender],['身長・体重',m.height],['現住所',m.area],['最終学歴',m.edu],['年収',m.income?m.income+'万円':''],['職業',m.job],['職種',m.job2],['所属相談所',m.office],['趣味',m.hobby],['婚歴',m.married]].filter(r=>r[1]);
  const ph=m.photo?`<img class="print-photo" src="${m.photo}">`:`<div class="print-photo" style="background:#f3f0f2;display:flex;align-items:center;justify-content:center;font-size:28px;border-radius:6px;border:1px solid #eee">👤</div>`;
  const fam=m.family&&m.family.length?`<div class="print-section"><div class="print-section-title">家族構成</div><table class="print-table">${m.family.map(f=>`<tr><td>${f.rel}</td><td>${f.status}</td></tr>`).join('')}</table></div>`:'';
  document.getElementById('print-area').innerHTML=`<div class="print-header"><div class="print-brand">💍 日本マッチメーカー</div><div class="print-title">会員プロフィール</div></div><div class="print-top">${ph}<div><div class="print-name">${m.name||'（名前未設定）'}</div><div style="font-size:13px;color:#666;margin-top:4px">${[m.gender,age?age+'歳':'',m.area].filter(Boolean).join('　')}</div></div></div><div class="print-section"><div class="print-section-title">基本情報</div><table class="print-table">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>${m.note?`<div class="print-section"><div class="print-section-title">コメント</div><div class="print-note">${m.note}</div></div>`:''}${fam}<div class="print-footer">印刷日：${new Date().toLocaleDateString('ja-JP')}　日本マッチメーカー 仲人専用システム</div>`;
  window.print();
}

// ========== お見合い ==========
async function loadOmiai(){
  if(!state.sbUrl||!state.sbKey)return[];
  try{const res=await sbFetch('omiai?select=*&order=created_at.desc');if(res.ok)return await res.json();}catch(e){}
  return[];
}
async function saveOmiai(o){
  if(!state.sbUrl||!state.sbKey)return false;
  try{const res=await sbFetch('omiai',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(o)});return res.ok;}catch(e){return false;}
}
async function updateOmiaiStatus(id,status){
  if(!state.sbUrl||!state.sbKey)return false;
  try{const res=await sbFetch('omiai?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status,updated_at:new Date().toISOString()})});return res.ok;}catch(e){return false;}
}
function openOmiaiModal(){
  const m=state.members.find(x=>x.id===state.detailId);if(!m)return;
  document.getElementById('omiai-to-name').textContent=m.name||'（名前未設定）';
  const sel=document.getElementById('omiai-from-member');
  const opposite=state.members.filter(x=>x.gender!==m.gender);
  sel.innerHTML=opposite.map(x=>`<option value="${x.id}">${x.name||'（名前未設定）'}</option>`).join('');
  document.getElementById('omiai-message').value='';
  document.getElementById('omiai-modal').classList.add('open');
}
async function submitOmiai(){
  const toM=state.members.find(x=>x.id===state.detailId);
  const fromId=document.getElementById('omiai-from-member').value;
  const fromM=state.members.find(x=>x.id===fromId);
  if(!toM||!fromM)return;
  const omiai={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2),
    from_member_id:fromM.id,from_member_name:fromM.name||'',
    to_member_id:toM.id,to_member_name:toM.name||'',
    to_user:toM.office||'',
    status:'pending',
    message:document.getElementById('omiai-message').value,
    created_at:new Date().toISOString(),updated_at:new Date().toISOString()
  };
  const ok=await saveOmiai(omiai);
  if(ok){alert('お見合いを申し込みました');closeModal('omiai-modal');}
  else alert('保存に失敗しました。Supabase接続を確認してください。');
}
async function renderOmiai(){
  const list=await loadOmiai();
  document.getElementById('omiai-count-label').textContent=list.length+'件';
  if(!list.length){document.getElementById('omiai-list').innerHTML='<div class="empty-state"><div class="icon">💌</div><div>お見合いの申し込みはありません</div></div>';return;}
  document.getElementById('omiai-list').innerHTML=list.map(o=>{
    const statusLabel={pending:'保留中',accepted:'成立',rejected:'お断り'}[o.status]||o.status;
    const statusClass=o.status||'pending';
    const actions=isAdmin()&&o.status==='pending'?`<div class="omiai-actions"><button class="btn-accept" onclick="changeOmiaiStatus('${o.id}','accepted')">✓ 成立</button><button class="btn-reject" onclick="changeOmiaiStatus('${o.id}','rejected')">✗ お断り</button></div>`:'';
    return`<div class="omiai-card"><div class="omiai-card-top"><span class="omiai-badge ${statusClass}">${statusLabel}</span><span style="font-size:11px;color:var(--text3)">${o.created_at?o.created_at.slice(0,10):''}</span></div><div class="omiai-names">${o.from_member_name} → ${o.to_member_name}</div><div class="omiai-meta">${o.message||''}</div>${actions}</div>`;
  }).join('');
}
async function changeOmiaiStatus(id,status){
  await updateOmiaiStatus(id,status);renderOmiai();
}
async function checkNotifications(){
  if(!state.sbUrl||!state.sbKey)return;
  try{
    const res=await sbFetch('omiai?status=eq.pending&to_user=eq.'+encodeURIComponent(state.currentUser));
    if(res.ok){const list=await res.json();if(list.length>0){const tab=document.getElementById('tab-omiai');tab.textContent='お見合い管理 🔴';}}
  }catch(e){}
}

// ========== 設定 ==========
function showSettings(){
  if(!isAdmin())return;
  document.getElementById('main-screen').style.display='none';
  document.getElementById('settings-screen').style.display='block';
  document.getElementById('sb-url').value=state.sbUrl;
  document.getElementById('sb-key').value=state.sbKey;
  renderAccountList();renderOfficeList();
}
function backToMain(){
  document.getElementById('settings-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
}
async function testConnection(){
  const url=(document.getElementById('sb-url').value||'').trim();
  const key=(document.getElementById('sb-key').value||'').trim();
  const el=document.getElementById('conn-status');
  el.style.display='inline-block';el.textContent='接続中...';el.className='conn-status';
  try{
    const res=await fetch(url+'/rest/v1/members?select=id&limit=1',{headers:{'apikey':key,'Authorization':'Bearer '+key}});
    if(res.ok){el.textContent='✅ 接続成功！';el.className='conn-status conn-ok';}
    else{el.textContent='❌ 接続失敗（'+res.status+'）';el.className='conn-status conn-err';}
  }catch(e){el.textContent='❌ エラー：'+e.message;el.className='conn-status conn-err';}
}
async function saveSbConfigAndReload(){
  state.sbUrl=(document.getElementById('sb-url').value||'').trim();
  state.sbKey=(document.getElementById('sb-key').value||'').trim();
  try{localStorage.setItem(SB_CFG_KEY,JSON.stringify({url:state.sbUrl,key:state.sbKey}));}catch(e){}
  const ok=await loadFromSupabase();
  if(!ok)loadLocal();
  renderMembers();
  updateOfficeOptions();
  backToMain();
  alert('保存しました。');
}

// ========== アカウント管理 ==========
function renderAccountList(){
  const accounts=loadAccounts();
  document.getElementById('account-list').innerHTML=accounts.map((a,i)=>`<div class="account-row"><div class="account-info"><span>👤 ${a.id}</span><span class="account-role ${a.role==='admin'?'admin':'viewer'}">${a.role==='admin'?'管理者':'閲覧者'}</span></div><div style="display:flex;gap:4px">${`<button class="btn-edit-sm" onclick="openAccountEdit(${i})">編集</button>`}${a.id!=='admin'?`<button class="btn-del-sm" onclick="removeAccount(${i})">削除</button>`:'<span style="font-size:11px;color:var(--text3)">削除不可</span>'}</div></div>`).join('');
}
let editingAccountIdx=null;
function openAccountEdit(idx){
  const accounts=loadAccounts();const a=accounts[idx];
  editingAccountIdx=idx;
  document.getElementById('edit-uid').value=a.id;
  document.getElementById('edit-pw').value='';
  document.getElementById('edit-role').value=a.role||'viewer';
  document.getElementById('account-edit-modal').classList.add('open');
}
function saveAccountEdit(){
  const accounts=loadAccounts();
  const pw=document.getElementById('edit-pw').value;
  if(pw)accounts[editingAccountIdx].pw=pw;
  accounts[editingAccountIdx].role=document.getElementById('edit-role').value;
  saveAccounts(accounts);closeModal('account-edit-modal');renderAccountList();
}
function removeAccount(idx){
  const accounts=loadAccounts();
  if(accounts[idx].id==='admin'){alert('adminは削除できません');return;}
  if(!confirm(accounts[idx].id+'を削除しますか？'))return;
  accounts.splice(idx,1);saveAccounts(accounts);renderAccountList();
}
function addAccount(){
  const uid=document.getElementById('new-uid').value.trim();
  const pw=document.getElementById('new-pw').value.trim();
  const role=document.getElementById('new-role').value;
  if(!uid||!pw){alert('IDとパスワードを入力してください');return;}
  const accounts=loadAccounts();
  if(accounts.find(a=>a.id===uid)){alert('そのIDはすでに存在します');return;}
  accounts.push({id:uid,pw,role});
  saveAccounts(accounts);closeModal('account-modal');renderAccountList();
  document.getElementById('new-uid').value='';document.getElementById('new-pw').value='';
}

// ========== 所属相談所管理 ==========
function loadOffices(){try{const d=localStorage.getItem(OFFICES_KEY);if(d)return JSON.parse(d);}catch(e){}return[];}
function saveOffices(list){try{localStorage.setItem(OFFICES_KEY,JSON.stringify(list));}catch(e){}}
function renderOfficeList(){
  const list=loadOffices();
  document.getElementById('office-list').innerHTML=list.map((o,i)=>`<div class="office-row"><span>${o}</span><button class="btn-del-sm" onclick="removeOffice(${i})">削除</button></div>`).join('');
}
function addOffice(){
  const v=document.getElementById('new-office-input').value.trim();
  if(!v)return;
  const list=loadOffices();
  if(list.includes(v)){alert('すでに存在します');return;}
  list.push(v);saveOffices(list);renderOfficeList();updateOfficeDropdown();
  document.getElementById('new-office-input').value='';
}
function removeOffice(idx){
  const list=loadOffices();list.splice(idx,1);saveOffices(list);renderOfficeList();updateOfficeDropdown();
}
function updateOfficeDropdown(){
  const list=loadOffices();
  const sel=document.getElementById('f-office');
  if(!sel)return;
  const cur=sel.value;
  sel.innerHTML='<option value="">選択してください</option>'+list.map(o=>`<option value="${o}">${o}</option>`).join('');
  if(cur)sel.value=cur;
}
